name: Contracts

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: contracts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out pinned source and dependencies
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          submodules: true
          persist-credentials: false

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@b00af27efadbc7b4ca8b82abbd903b17cc874d2a
        with:
          version: v1.5.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.12.5'
          enable-cache: false

      - name: Verify security-tool dependency lock
        run: |
          uv pip compile requirements-security.txt \
            --python-version 3.12 \
            --python-platform x86_64-manylinux_2_28 \
            --generate-hashes \
            --no-emit-index-url \
            --custom-compile-command 'uv pip compile requirements-security.txt --python-version 3.12 --python-platform x86_64-manylinux_2_28 --generate-hashes --no-emit-index-url --output-file requirements-security.lock' \
            --output-file requirements-security.lock
          git diff --exit-code -- requirements-security.lock

      - name: Install locked security tools
        run: |
          pip install --require-hashes --only-binary=:all: \
            -r requirements-security.lock

      - name: Audit security-tool dependencies
        run: >-
          uvx --from pip-audit==2.9.0 pip-audit
          -r requirements-security.lock --require-hashes --no-deps --disable-pip

      - name: Set up Node.js
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: '24'
          cache: npm

      - name: Install locked JavaScript dependencies
        run: npm ci --ignore-scripts

      - name: Audit production JavaScript dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Check catalog formatting
        run: >
          forge fmt --check
          contracts/GridCatalogV2.sol
          test/GridCatalogV2.t.sol
          test/GridCatalogV2.invariant.t.sol

      - name: Build contracts
        run: forge build --sizes

      - name: Analyze deployable contracts
        run: slither .

      - name: Run Foundry tests
        run: forge test

      - name: Test catalog plan builder
        run: python3 -m unittest scripts/catalog/test_build_plan.py

      - name: Check catalog and deployment scripts
        run: |
          node --check scripts/interact-aipg-token.js
          node --check scripts/add-recipe-test.js
          node --check scripts/deployment/upgrade-modelvault-facet.js
          node --check scripts/catalog/canonicalize.mjs
          shellcheck scripts/deployment/deploy-grid-catalog-v2.sh
          bash -n scripts/deployment/deploy-grid-catalog-v2.sh
